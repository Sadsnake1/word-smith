# Builds the release assets from the tagged commit and attaches them, with
# GitHub's build attestations. Runs when a release is published; run it by
# hand (Actions > Release > Run workflow) for a release that already exists.
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and attach the assets to (for example 1.5.4)"
        required: true

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      # The smoke test over the built files: they load, they ask Obsidian for
      # their packages at run time, the files agree on their versions, and
      # main.js and build/styles.css are the source minus its comments.
      - run: npm test
      # main.js IS THE BUILD'S OUTPUT, attached as written: the build writes
      # it without the comments the source carries, so a build from source
      # and the asset are one file. build/styles.css is styles.css without
      # its comments (the sheet beside the manifest stays the source). The
      # asset names are unchanged.
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            build/styles.css
            manifest.json
      - name: Attach the assets to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name || inputs.tag }}" main.js build/styles.css manifest.json --clobber
