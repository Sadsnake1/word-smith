# Builds the release assets from the tagged commit and attaches them, with
# GitHub's build attestations. Runs when a release is published; run it by
# hand (Actions > Release > Run workflow) for a release that already exists.
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and attach the assets to (for example 1.5.4)"
        required: true

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      # The smoke test over the built files: they load, they ask Obsidian for
      # their packages at run time, the files agree on their versions, and
      # build/main.js and build/styles.css are the source minus its comments.
      - run: npm test
      # THE ASSETS ARE build/'s: the same code without the comments the
      # source carries (about 900 KB of a 2.3 MB plugin). The files beside the
      # manifest stay the source; the asset names are unchanged.
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            build/main.js
            build/styles.css
            manifest.json
      - name: Attach the assets to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name || inputs.tag }}" build/main.js build/styles.css manifest.json --clobber
